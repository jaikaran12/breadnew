# Optional: run everything on your own server (VPS) instead of Cloudflare: app + automatic HTTPS.
#   1. cp .env.example .env   and fill it in
#   2. docker compose up -d --build
# The data is one SQLite file in the "app-data" volume. Download backups from the website (Settings).
name: bread-sales

services:
  app:
    build: .
    image: bread-sales:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-owner}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BUSINESS_NAME: ${BUSINESS_NAME:-My Bakery}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
      DRIVER_CANCEL_WINDOW_MINUTES: ${DRIVER_CANCEL_WINDOW_MINUTES:-30}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: '1'
    volumes:
      - app-data:/app/data
    ports:
      # Only reachable from the server itself (for checks). Everyone else goes through Caddy (HTTPS).
      - '127.0.0.1:8080:8080'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
