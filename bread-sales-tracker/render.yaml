# Render.com Blueprint: web service (Docker) + managed PostgreSQL.
# In Render: New > Blueprint > pick this repository > Blueprint path: bread-sales-tracker/render.yaml
services:
  - type: web
    name: bread-sales
    runtime: docker
    dockerfilePath: ./bread-sales-tracker/Dockerfile
    dockerContext: ./bread-sales-tracker
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bread-sales-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DRIVER_CANCEL_WINDOW_MINUTES
        value: '30'

databases:
  - name: bread-sales-db
    region: singapore
    plan: basic-256mb
    databaseName: bread
    user: bread
    postgresMajorVersion: '16'
