# Render.com Blueprint for Bread Sales (the app itself lives in bread-sales-tracker/).
# One-click setup: https://render.com/deploy?repo=https://github.com/jaikaran12/breadnew
# Render looks for this file at the top of the repository, which is why it is not inside the folder.
#
# Starts on Render's FREE plans so you can try it at no cost. Before drivers use it for real,
# upgrade both to paid plans in the Render dashboard (the free database is deleted after 30 days,
# and the free web service sleeps when idle and takes ~1 minute to wake up).
services:
  - type: web
    name: breadnew-sales
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./bread-sales-tracker/Dockerfile
    dockerContext: ./bread-sales-tracker
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - bread-sales-tracker/**
      ignoredPaths:
        - bread-sales-tracker/driver-app/android/**
        - bread-sales-tracker/**/*.md
        - bread-sales-tracker/docs/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breadnew-sales-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DRIVER_CANCEL_WINDOW_MINUTES
        value: '30'
      - key: APP_DOWNLOAD_URL
        value: https://github.com/jaikaran12/breadnew/releases/latest/download/bread-sales.apk

databases:
  - name: breadnew-sales-db
    plan: free
    region: singapore
    databaseName: bread
    user: bread
    postgresMajorVersion: '16'
    # Only the web service (inside Render) may connect; no access from the internet.
    ipAllowList: []
