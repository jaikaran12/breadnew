# Bread Sales: tests + builds for everything in bread-sales-tracker/
# - server tests (PostgreSQL), web app builds, Docker image, and the Android app.
# - The Android app is a thin wrapper that opens the driver web app (bread-sales-tracker/android-wrapper).
#   Its web address is appUrl in android-wrapper/gradle.properties, or the repository variable APP_URL.
# - Push a tag like "bread-sales-v1.0.0" (or run this workflow on such a tag): publishes the APK as a GitHub
#   Release. Drivers always get the newest app from .../releases/latest/download/bread-sales.apk
# Signing key secrets (Settings > Secrets and variables > Actions > Secrets), see bread-sales-tracker/README.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD   (ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD optional)
name: Bread Sales

on:
  push:
    paths:
      - 'bread-sales-tracker/**'
      - '.github/workflows/bread-sales.yml'
    tags:
      - 'bread-sales-v*'
  pull_request:
    paths:
      - 'bread-sales-tracker/**'
      - '.github/workflows/bread-sales.yml'
  workflow_dispatch:

concurrency:
  group: bread-sales-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bread-sales-tracker/server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bread
          POSTGRES_PASSWORD: bread
          POSTGRES_DB: bread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bread -d bread_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bread-sales-tracker/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://bread:bread@localhost:5432/bread_test

  web:
    name: Admin + driver web apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bread-sales-tracker/admin-web/package-lock.json
            bread-sales-tracker/driver-app/package-lock.json
      - name: Admin website
        working-directory: bread-sales-tracker/admin-web
        run: |
          npm ci
          npm run build
      - name: Driver app (tests + web build)
        working-directory: bread-sales-tracker/driver-app
        run: |
          npm ci
          npm test
          npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t bread-sales:ci bread-sales-tracker

  android:
    name: Android app (wrapper)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bread-sales-tracker/android-wrapper
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: bread-sales-tracker/android-wrapper/**/*.gradle*
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/bread-sales-v') }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key found."
          elif [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "::error::A release needs the signing key. Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see README)."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a TEST (debug) APK. Set up the release key before giving the app to drivers (see README)."
          fi
      - name: Build APK
        env:
          APP_URL_VAR: ${{ vars.APP_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$APP_URL_VAR" ]; then export APP_URL="$APP_URL_VAR"; fi
          echo "The app opens: ${APP_URL:-$(sed -n 's/^appUrl=//p' gradle.properties)}"
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/apk"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/bread-sales-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/bread-sales-$VERSION_NAME-TEST.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bread-sales-android-${{ env.VERSION_NAME }}
          path: apk/*.apk
          if-no-files-found: error
      - name: Prepare release files (tags only)
        if: startsWith(github.ref, 'refs/tags/bread-sales-v')
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p release
          cp "apk/bread-sales-$VERSION_NAME.apk" "release/bread-sales-$VERSION_NAME.apk"
          # Same file under a fixed name, so .../releases/latest/download/bread-sales.apk always works.
          cp "apk/bread-sales-$VERSION_NAME.apk" release/bread-sales.apk
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/bread-sales-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          body: |
            **Bread Sales driver app ${{ env.VERSION_NAME }}**

            Install on the driver's phone (Android 7 or newer, with Chrome): open this link on the phone,
            download, and tap Install (allow "Install unknown apps" for Chrome or WhatsApp when asked):
            https://github.com/${{ github.repository }}/releases/latest/download/bread-sales.apk

            The app opens the driver web app, so updates to the website reach drivers without a new APK.
