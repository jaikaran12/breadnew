# Bread Sales: tests + builds for everything in bread-sales-tracker/
# - Every push: server tests (PostgreSQL), web builds, Docker image build, Android APK (downloadable from the run page).
# - Push a tag like "bread-sales-v1.0.0": also publishes the APK as a GitHub Release.
#
# Optional settings (repository Settings > Secrets and variables > Actions):
#   Variable  API_BASE_URL              your server, e.g. https://sales.mybakery.in (built into the app)
#   Secrets   ANDROID_KEYSTORE_BASE64   release signing key (see bread-sales-tracker/README.md)
#             ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Bread Sales

on:
  push:
    paths:
      - 'bread-sales-tracker/**'
      - '.github/workflows/bread-sales.yml'
    tags:
      - 'bread-sales-v*'
  pull_request:
    paths:
      - 'bread-sales-tracker/**'
      - '.github/workflows/bread-sales.yml'
  workflow_dispatch:

concurrency:
  group: bread-sales-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bread-sales-tracker/server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bread
          POSTGRES_PASSWORD: bread
          POSTGRES_DB: bread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bread -d bread_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bread-sales-tracker/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://bread:bread@localhost:5432/bread_test

  web:
    name: Admin + driver web apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bread-sales-tracker/admin-web/package-lock.json
            bread-sales-tracker/driver-app/package-lock.json
      - name: Admin website
        working-directory: bread-sales-tracker/admin-web
        run: |
          npm ci
          npm run build
      - name: Driver app (tests + web build)
        working-directory: bread-sales-tracker/driver-app
        run: |
          npm ci
          npm test
          npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t bread-sales:ci bread-sales-tracker

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bread-sales-tracker/driver-app
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bread-sales-tracker/driver-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: bread-sales-tracker/driver-app/android/**/*.gradle*
      - run: npm ci
      - name: Build the app screens
        run: npm run build:android
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Copy screens into the Android project
        run: npx cap sync android
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key found."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a TEST (debug) APK. Set up a release key before giving the app to drivers (see README)."
          fi
      - name: Build APK
        working-directory: bread-sales-tracker/driver-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/apk"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/bread-sales-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/bread-sales-$VERSION_NAME-TEST.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bread-sales-android-${{ env.VERSION_NAME }}
          path: apk/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/bread-sales-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body: |
            Android app for drivers. Download the .apk on the driver's phone and install it
            (allow "Install unknown apps" for the browser / WhatsApp when asked).
