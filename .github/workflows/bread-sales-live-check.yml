# Checks that the live Bread Sales website answers correctly (Actions tab > "Bread Sales live check" > Run workflow).
name: Bread Sales live check

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website address, e.g. https://bread-sales.yourname.workers.dev'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bread-sales-tracker/server/cloudflare
      - name: Check the live website
        run: bash bread-sales-tracker/server/cloudflare/check.sh "${{ inputs.url }}"
